name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Publish dist to the branch GitHub Pages is serving
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf assets
          cp -a dist/. .
          git add -A -- index.html 404.html favicon.svg icons.svg .nojekyll assets
          if git diff --staged --quiet; then
            echo "No site files to publish"
            exit 0
          fi
          git commit -m "chore: publish GitHub Pages [skip ci]"
          git push
      - name: Rebuild GitHub Pages
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            try {
              await github.rest.repos.requestPagesBuild({
                owner: context.repo.owner,
                repo: context.repo.repo,
              })
            } catch (error) {
              core.warning(error.message)
            }
